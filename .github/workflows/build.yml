name: Build

# Binaries for every platform Misa builds on, plus the Linux AppImages, as one
# workflow artifact (a directory per platform; the zip drops executable bits).
# A pushed v* tag also publishes them as a release, one .tar.xz per platform.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Build misa, ugh and ughbot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/misa .
          go build -trimpath -ldflags='-s -w' -o dist/ugh ./cmd/ugh
          go build -trimpath -ldflags='-s -w' -o dist/ughbot ./cmd/ughbot
          cp LICENSE README.md THIRD_PARTY_NOTICES.md dist/
      # Raw files: the artifact zip is the only compression.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  appimage:
    name: AppImage ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            tool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            runner: ubuntu-24.04-arm
            tool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
    env:
      APPIMAGETOOL_VERSION: '1.9.1'
      RUNTIME_VERSION: '20251108'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Fetch pinned appimagetool and runtime
        env:
          ARCH: ${{ matrix.arch }}
          TOOL_SHA256: ${{ matrix.tool_sha256 }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-$ARCH.AppImage"
          curl -fsSL -o runtime "https://github.com/AppImage/type2-runtime/releases/download/$RUNTIME_VERSION/runtime-$ARCH"
          printf '%s  appimagetool\n%s  runtime\n' "$TOOL_SHA256" "$RUNTIME_SHA256" | sha256sum -c -
          chmod +x appimagetool
      - name: Build the AppImage
        env:
          ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/misa .
          APPIMAGETOOL="$RUNNER_TEMP/appimage/appimagetool" APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage/runtime" \
            packaging/appimage/build.sh dist/misa "dist/Misa-$(git describe --tags --always)-$ARCH.AppImage" "$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  android:
    name: android/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-linux-android24-clang
          - arch: amd64
            triple: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - uses: actions/setup-java@v4
        if: matrix.arch == 'arm64'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
        if: matrix.arch == 'arm64'
      - id: ndk
        run: echo "version=$(tr -d '[:space:]' < android/ndk.version)" >> "$GITHUB_OUTPUT"
      # The runner image owns /usr/local/lib/android/sdk as root. Cache
      # restore otherwise fails utime and chmod on the NDK tree.
      - name: Make the NDK directory writable
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo chown -R "$USER" /usr/local/lib/android/sdk/ndk
      - uses: actions/cache@v4
        id: ndk-cache
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk.outputs.version }}
          key: ndk-${{ steps.ndk.outputs.version }}
      - name: Install the pinned NDK
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        env:
          NDK_VERSION: ${{ steps.ndk.outputs.version }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          sdkmanager=$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n 1)
          mkdir -p "$sdk/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$sdk/licenses/android-sdk-license"
          "$sdkmanager" --sdk_root="$sdk" "ndk;${NDK_VERSION}"
      - name: Build the Termux CLI
        env:
          NDK_VERSION: ${{ steps.ndk.outputs.version }}
          GOOS: android
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
          CC: /usr/local/lib/android/sdk/ndk/${{ steps.ndk.outputs.version }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.triple }}
        run: |
          set -euo pipefail
          test -x "$CC"
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/misa .
          go build -trimpath -ldflags='-s -w' -o dist/ugh ./cmd/ugh
          cp LICENSE README.md THIRD_PARTY_NOTICES.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

      - name: Install compile SDK and build-tools
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          mkdir -p "$sdk/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee > "$sdk/licenses/android-sdk-license"
          sdkmanager=$(find "$sdk/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$sdkmanager" --sdk_root="$sdk" "platforms;android-35" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        if: matrix.arch == 'arm64'

      # Per-ABI APKs, plus a universal APK on non-tag builds. Tag builds stay
      # unsigned here; apk-sign (environment: release) signs them.
      - name: Build APKs
        if: matrix.arch == 'arm64'
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ steps.ndk.outputs.version }}
        run: |
          set -euo pipefail
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          ./android/build-go.sh
          cd android
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew assembleRelease -PskipGoBuild -PuniversalApk=false --console=plain
          else
            ./gradlew assembleDebug -PskipGoBuild -PuniversalApk=true --console=plain
          fi

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64' && !startsWith(github.ref, 'refs/tags/v')
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: apk-unsigned
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Tag builds only. The release environment keeps the keystore secrets off
  # pull requests. Without ANDROID_KEYSTORE_B64 the APKs are debug-signed
  # and named -debug.apk.
  apk-sign:
    name: apk-sign
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-unsigned
          path: apk
      - name: Sign release APKs
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          sdk="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          apksigner=$(find "$sdk/build-tools" -type f -name apksigner | sort | tail -n 1)
          test -n "$apksigner"
          sign_one() {
            "$apksigner" sign \
              --ks "$3" \
              --ks-pass "env:ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "env:ANDROID_KEY_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "$2" "$1"
            "$apksigner" verify --verbose "$2"
          }
          if [[ -n ${ANDROID_KEYSTORE_B64:-} ]]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            for apk in apk/*.apk; do
              sign_one "$apk" "$apk.signed" "$RUNNER_TEMP/release.jks"
              mv "$apk.signed" "$apk"
            done
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "ANDROID_KEYSTORE_B64 is unset; debug-signing the release APKs" >&2
            keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            export ANDROID_KEYSTORE_PASSWORD=android ANDROID_KEY_PASSWORD=android ANDROID_KEY_ALIAS=androiddebugkey
            for apk in apk/*.apk; do
              base=${apk%.apk}
              dest=$apk
              if [[ $base != *-debug ]]; then
                dest="${base}-debug.apk"
              fi
              sign_one "$apk" "$dest" "$RUNNER_TEMP/debug.jks"
              if [[ $dest != "$apk" ]]; then
                rm -f "$apk"
              fi
            done
            rm -f "$RUNNER_TEMP/debug.jks"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/*.apk
          if-no-files-found: error

  # One artifact with every platform, a directory each.
  # apk-sign is skipped off tags; a skipped need would skip this job too.
  bundle:
    needs: [binaries, appimage, android, apk-sign]
    if: |
      always() &&
      (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') &&
      (needs.appimage.result == 'success' || needs.appimage.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.apk-sign.result == 'success' || needs.apk-sign.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: misa
          separate-directories: true
          delete-merged: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: misa
          path: misa
      # The binaries share most of their code, so xz with a large window
      # halves each platform's archive compared with gzip.
      - name: Package the platforms
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          for dir in misa/*/; do
            platform=$(basename "$dir")
            case $platform in
            appimage-*) mv "$dir"/*.AppImage release/ ;;
            apk) mv "$dir"/*.apk release/ ;;
            apk-unsigned) ;;
            *)
              chmod +x "$dir"/misa "$dir"/ugh
              [ -e "$dir/ughbot" ] && chmod +x "$dir/ughbot" || true
              mv "$dir" "misa-$TAG-$platform"
              tar -cf - "misa-$TAG-$platform" | xz -9e --lzma2=preset=9e,dict=128MiB > "release/misa-$TAG-$platform.tar.xz"
              ;;
            esac
          done
          chmod +x release/*.AppImage
          cd release && sha256sum -- * > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes release/*

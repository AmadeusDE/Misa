{{define "content"}}
<p>Enter the one-time code from your authenticator app. A key is generated in this browser and only its public half is sent.</p>
<form id="enroll">
<label>Device name <input name="name" required maxlength="64" autocomplete="off"></label>
<label>Code <input name="code" required inputmode="numeric" pattern="[0-9 ]*" autocomplete="one-time-code"></label>
<button type="submit">Enroll</button>
</form>
<p id="status"></p>
<script src="/static/ed25519.js"></script>
<script src="/static/auth.js"></script>
{{end}}
